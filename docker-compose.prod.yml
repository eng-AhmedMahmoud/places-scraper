services:
  places-scraper:
    # Stock Node image and no build on the VPS: scripts/deploy.sh builds the
    # Next.js standalone server on the Mac (Linux x86-64 native binaries) and
    # ships it to releases/<sha>; ./current points at the live one.
    image: node:24.22.1-alpine
    container_name: places-scraper
    restart: unless-stopped
    user: "1000:1000"             # node
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    # Stack Auth keys, GOOGLE_MAPS_API_KEY, MAX_API_CALLS. Outside the release
    # directory, which scripts/deploy.sh replaces: the values never travel with
    # a release. The NEXT_PUBLIC_* ones are inlined at build time, so changing
    # them needs a redeploy.
    env_file:
      - path: /home/devya/projects/places-scraper.env
        required: false
    volumes:
      - ./current:/app:ro
    tmpfs:
      # The only path Next.js writes at runtime (image optimizer cache).
      - /app/.next/cache:uid=1000,gid=1000,size=64m
    ports:
      # Loopback-only: nginx reverse-proxies to localhost:3195. Without the
      # 127.0.0.1 prefix Docker publishes on 0.0.0.0, which ufw does not filter.
      - "127.0.0.1:3195:3000"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
