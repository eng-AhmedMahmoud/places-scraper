# placeharvest.devya-solutions.com: left Vercel after the 2026-11-13 account pause. The
# container listens on loopback :3195 (docker-compose.prod.yml in
# /home/devya/projects/places-scraper).
# Installed once by scripts/deploy.sh (HTTP only); pending-certs runs certbot
# --nginx once DNS points at this VPS, which adds the 443 block in place.
upstream places_scraper {
    server 127.0.0.1:3195;
    keepalive 16;
}
server {
    listen 80;
    listen [::]:80;
    server_name placeharvest.devya-solutions.com;

    # /api/export posts every scraped row to build the .xlsx (Vercel allowed
    # 4.5 MB; next.config.ts allows server actions 5 MB).
    client_max_body_size 5m;

    location / {
        proxy_pass http://places_scraper;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # /api/scrape streams server-sent events for up to 300 s (maxDuration);
        # it sends X-Accel-Buffering: no itself.
        proxy_read_timeout 310s;
    }
}
